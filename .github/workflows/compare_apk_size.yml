name: APK Size Comparison

on:
  workflow_run:
    workflows:
      - "Emulator Tests"
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  sizeCheck:
    name: APK Size Check
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      KEYSTORENAME: keystore
      KEYSTOREPWD: testpass
      KEYPWD: testpass
      KEYALIAS: nrkeystorealias
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Resolve pull request
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        with:
          script: |
            const headBranch = process.env.HEAD_BRANCH;
            const headSha = process.env.HEAD_SHA;
            const headRepository = process.env.HEAD_REPOSITORY || `${context.repo.owner}/${context.repo.repo}`;
            if (!headBranch || !headSha || headRepository.split('/').length !== 2) {
              throw new Error('Workflow run did not include valid PR identity metadata');
            }

            const headOwner = headRepository.split('/')[0];
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${headOwner}:${headBranch}`,
              per_page: 100,
            });
            const matches = pullRequests.filter(pullRequest =>
              pullRequest.head.repo?.full_name === headRepository &&
              pullRequest.head.ref === headBranch &&
              pullRequest.head.sha === headSha &&
              pullRequest.base.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            if (matches.length !== 1) {
              throw new Error(`Expected one PR for ${headRepository}:${headBranch} at ${headSha}; found ${matches.length}`);
            }

            core.setOutput('number', String(matches[0].number));
            core.setOutput('base_ref', matches[0].base.ref);
            core.setOutput('head_sha', matches[0].head.sha);

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Credential Prep
        run: |
          export KEYSTOREPATH=$HOME/$KEYSTORENAME
          echo "KEYSTOREPATH=$KEYSTOREPATH" >> $GITHUB_ENV
          echo y | keytool -genkeypair -dname "cn=AnkiDroid, ou=ankidroid, o=AnkiDroid, c=US" -alias $KEYALIAS -keypass $KEYPWD -keystore $KEYSTOREPATH -storepass $KEYSTOREPWD -keyalg RSA -validity 20000
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Download PR APK size
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          name: apk-size
          run_id: ${{ github.event.workflow_run.id }}
          path: pr

      - name: Find merge base for PR
        id: merge-base
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          BASE_REF: ${{ steps.pull-request.outputs.base_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          actual_head_sha=$(git rev-parse "refs/remotes/pull/$PR_NUMBER/head")
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "PR head changed after the emulator run; waiting for the newer run is required."
            exit 1
          fi

          merge_base=$(git merge-base "refs/remotes/origin/$BASE_REF" "refs/remotes/pull/$PR_NUMBER/head")
          if [[ -z "$merge_base" ]]; then
            echo "Could not find the PR merge base."
            exit 1
          fi
          echo "Resolved APK baseline to merge base $merge_base"
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
          git checkout --detach "$merge_base"

      - name: Assemble merge-base APK
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew :AnkiDroid:assemblePlayRelease --daemon

      - name: Compare APK sizes
        id: compare
        shell: bash
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
        run: |
          APK_PATH="AnkiDroid/build/outputs/apk/play/release/AnkiDroid-play-arm64-v8a-release.apk"
          old_size=$(stat -c '%s' "$APK_PATH")
          new_size=$(<pr/apk-size.txt)
          if [[ ! "$old_size" =~ ^[0-9]+$ || ! "$new_size" =~ ^[0-9]+$ || "$old_size" -eq 0 ]]; then
            echo "Merge-base or PR APK size artifact contained invalid values."
            exit 1
          fi
          difference=$((new_size - old_size))
          percent=$(awk -v difference="$difference" -v old_size="$old_size" 'BEGIN { printf "%.2f", difference * 100 / old_size }')

          {
            echo "old_size=$old_size"
            echo "new_size=$new_size"
            echo "difference=$difference"
            echo "percent=$percent"
            echo "merge_base=$MERGE_BASE"
          } >> "$GITHUB_OUTPUT"

      - name: Comment APK size comparison
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          OLD_SIZE: ${{ steps.compare.outputs.old_size }}
          NEW_SIZE: ${{ steps.compare.outputs.new_size }}
          DIFFERENCE: ${{ steps.compare.outputs.difference }}
          PERCENT: ${{ steps.compare.outputs.percent }}
          MERGE_BASE: ${{ steps.compare.outputs.merge_base }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const oldSize = Number(process.env.OLD_SIZE);
            const newSize = Number(process.env.NEW_SIZE);
            const difference = Number(process.env.DIFFERENCE);
            const percent = process.env.PERCENT;
            const mergeBase = process.env.MERGE_BASE;
            const marker = '<!-- apk-size-comparison -->';
            const body = `${marker}
            **APK size comparison**

            Baseline (merge base ${mergeBase.slice(0, 7)}): ${oldSize.toLocaleString()} bytes
            PR: ${newSize.toLocaleString()} bytes
            Difference: ${difference.toLocaleString()} bytes (${percent}%)`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
