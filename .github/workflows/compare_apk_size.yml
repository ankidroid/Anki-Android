name: APK Size Comparison

on:
  workflow_run:
    workflows:
      - "Emulator Tests"
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  sizeCheck:
    name: APK Size Check
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download PR APK size
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          name: apk-size
          run_id: ${{ github.event.workflow_run.id }}
          path: pr

      - name: Download main APK size
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          name: apk-size
          workflow: tests_emulator.yml
          workflow_conclusion: success
          branch: main
          path: main
          if_no_artifact_found: ignore

      - name: Compare APK sizes
        id: compare
        shell: bash
        run: |
          if [[ ! -f main/apk-size.txt ]]; then
            echo "No successful main APK-size baseline is available yet."
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_size=$(<main/apk-size.txt)
          new_size=$(<pr/apk-size.txt)
          if [[ ! "$old_size" =~ ^[0-9]+$ || ! "$new_size" =~ ^[0-9]+$ || "$old_size" -eq 0 ]]; then
            echo "APK size artifacts did not contain valid byte counts."
            exit 1
          fi
          difference=$((new_size - old_size))
          percent=$(awk -v difference="$difference" -v old_size="$old_size" 'BEGIN { printf "%.2f", difference * 100 / old_size }')

          {
            echo "old_size=$old_size"
            echo "new_size=$new_size"
            echo "difference=$difference"
            echo "percent=$percent"
            echo "has_baseline=true"
          } >> "$GITHUB_OUTPUT"

      - name: Comment APK size comparison
        if: steps.compare.outputs.has_baseline == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f71010f7c # v9.0.0
        env:
          OLD_SIZE: ${{ steps.compare.outputs.old_size }}
          NEW_SIZE: ${{ steps.compare.outputs.new_size }}
          DIFFERENCE: ${{ steps.compare.outputs.difference }}
          PERCENT: ${{ steps.compare.outputs.percent }}
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const marker = '<!-- apk-size-comparison -->';
            const oldSize = Number(process.env.OLD_SIZE);
            const newSize = Number(process.env.NEW_SIZE);
            const difference = Number(process.env.DIFFERENCE);
            const percent = process.env.PERCENT;
            const body = `${marker}
            **APK size comparison**

            Main: ${oldSize.toLocaleString()} bytes
            PR: ${newSize.toLocaleString()} bytes
            Difference: ${difference.toLocaleString()} bytes (${percent}%)`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
