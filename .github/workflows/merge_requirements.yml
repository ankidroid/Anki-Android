name: 🛠️ Merge Requirements

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Required checks must also report a result for merge queue builds.
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squashMerge:
    name: Squash merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requires a squash merge
        if: github.event.pull_request.commits > 1 && contains(github.event.pull_request.labels.*.name, 'squash-merge')
        run: |
          echo "::error::This PR must be squashed before merging. Please squash appropriate commits and force push to resolve this."
          exit 1
